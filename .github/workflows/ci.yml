name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tournament-kit --ignore-scripts
      - run: npm run test:tournament-kit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:pure
